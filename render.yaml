services:
  - type: web
    name: aventurape-frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://aventurape-backend.onrender.com/api/v1
      - key: NODE_ENV
        value: production
